[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gh600"
version = "0.1.0"
description = "Learning sandbox for the GitHub Agentic AI Developer certification"
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "python-dotenv>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
